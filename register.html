<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - Registration</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="auth-page">
    <header class="auth-header">
      <div class="logo">
        <img src="images/logo.png" alt="ActiveCheck" class="logo-img" />
      </div>
    </header>

    <main class="auth-main">
      <!-- Registration: title sits above the card (white), like the Figma -->
      <div class="auth-stack">
        <h1 class="auth-title auth-title--light">Registration</h1>

        <div class="auth-card auth-card--wide">
          <form id="registerForm" novalidate>
            <div class="form-group">
              <input type="text" id="rName" class="input-field" placeholder="Full Name" autocomplete="name" />
              <p class="field-message" id="rNameMsg"></p>
            </div>

            <div class="form-group">
              <input type="email" id="rEmail" class="input-field" placeholder="Email" />
              <p class="field-message" id="rEmailMsg"></p>
            </div>

            <div class="form-group">
              <input type="password" id="rPassword" class="input-field" placeholder="Password" />
              <p class="field-message" id="rPasswordMsg"></p>
            </div>

            <div class="form-group">
              <input type="password" id="rConfirm" class="input-field" placeholder="Confirm Password" />
              <p class="field-message" id="rConfirmMsg"></p>
            </div>

            <div class="form-group">
              <select id="rRole" class="input-field select-field">
                <option value="">Role Selection</option>
                <option value="trainee">Trainee</option>
                <option value="coach">Coach</option>
              </select>
              <p class="field-message" id="rRoleMsg"></p>
            </div>

            <!-- small link back to login, mirrors the login page (matches its style) -->
            <p class="auth-switch">
              <a href="index.html" class="auth-switch-link">Already a member? Login here</a>
            </p>

            <button type="submit" class="btn btn-submit">Submit</button>
            <p class="field-message form-status text-center" id="rFormMsg"></p>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
