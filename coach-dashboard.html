<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - Coach Dashboard</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/app.css" />
  <link rel="stylesheet" href="style/ui.css" />
  <link rel="stylesheet" href="style/coach.css" />
</head>
<body>

  <div class="app-shell">

    <header class="topbar">
      <div class="logo">
        <img src="images/logo.png" alt="ActiveCheck" class="logo-img" />
      </div>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <div class="user-greeting">
        <span class="avatar" id="userInitial">?</span>
        <span id="userGreeting">Hello</span>
      </div>
    </header>

    <div class="app-body">

      <nav class="sidebar" id="sidebar">
        <a href="coach-dashboard.html" class="active">Dashboard</a>
        <a href="coach-programs.html">Programs</a>
        <a href="coach-trainees.html">Trainees</a>
      </nav>

      <main class="content">
        <div class="panel-dark">
          <h1 class="panel-title light">Coach Dashboard</h1>

          <h2 class="section-subtitle">Pending Assignment Requests</h2>
          <div class="list-rows" id="pendingList">
            <p class="state-msg">Loading...</p>
          </div>

          <h2 class="section-subtitle">Active Trainees</h2>
          <div class="list-rows" id="traineesList">
            <p class="state-msg">Loading...</p>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script src="js/coach-dashboard.js"></script>
</body>
</html>
