<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - Dashboard</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/app.css" />
  <link rel="stylesheet" href="style/dashboard.css" />
</head>
<body>

  <div class="app-shell">

    <header class="topbar">
      <div class="logo">
        <img src="images/logo.png" alt="ActiveCheck" class="logo-img" />
      </div>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <div class="user-greeting">
        <span class="avatar" id="userInitial">?</span>
        <span id="userGreeting">Hello</span>
      </div>
    </header>

    <div class="app-body">

      <nav class="sidebar" id="sidebar">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="workouts.html">Workouts</a>
        <a href="program.html">Program</a>
        <a href="metrics.html">Metrics</a>
        <a href="coaches.html">Coaches</a>
      </nav>

      <main class="content">
        <div class="panel dashboard-panel">
          <h1 class="panel-title light">Dashboard</h1>

          <div class="stat-row">
            <div class="stat-card">
              <span class="stat-label">Last Workout</span>
              <span class="stat-value" id="lastWorkoutVal">...</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Current Weight</span>
              <span class="stat-value" id="currentWeightVal">...</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Coach</span>
              <span class="stat-value" id="coachVal">...</span>
            </div>
          </div>

          <div class="action-col">
            <a href="new-workout.html" class="btn btn-black action-btn">New Workout</a>
            <a href="workout-history.html" class="btn btn-dark action-btn">Workout History</a>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
