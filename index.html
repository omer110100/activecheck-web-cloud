<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <!-- Dark page wrapper -->
  <div class="auth-page">

    <!-- Logo top-left -->
    <header class="auth-header">
      <div class="logo">
        ActiveCheck
        <!-- dumbbell icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5l11 11" />
          <path d="M21 21l-1-1" />
          <path d="M3 3l1 1" />
          <path d="M18 22l4-4" />
          <path d="M2 6l4-4" />
          <path d="M3 10l7-7" />
          <path d="M14 21l7-7" />
        </svg>
      </div>
    </header>

    <!-- Login card -->
    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">Login</h1>

        <!-- novalidate disables browser's default validation so JS handles it -->
        <form id="loginForm" novalidate>

          <div class="form-group">
            <input
              type="email"
              id="email"
              class="input-field"
              placeholder="Email"
              autocomplete="email"
            />
            <p class="field-message" id="emailMsg"></p>
          </div>

          <div class="form-group">
            <input
              type="password"
              id="password"
              class="input-field"
              placeholder="Password"
              autocomplete="current-password"
            />
            <p class="field-message" id="passwordMsg"></p>
          </div>

          <p class="signup-link">
            New Member? <a href="register.html">sign up here</a>
          </p>

          <button type="submit" class="btn btn-dark login-btn">Login</button>

          <!-- general success/error message -->
          <p class="field-message text-center" id="formMsg"></p>
        </form>
      </div>
    </main>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
