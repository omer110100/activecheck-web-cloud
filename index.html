<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <!-- Dark page wrapper -->
  <div class="auth-page">

    <!-- Logo top-left -->
    <header class="auth-header">
      <div class="logo">
        <img src="images/logo.png" alt="ActiveCheck" class="logo-img" />
      </div>
    </header>

    <!-- Login card -->
    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">Login</h1>

        <!-- novalidate disables browser's default validation so JS handles it -->
        <form id="loginForm" novalidate>

          <div class="form-group">
            <input
              type="email"
              id="email"
              class="input-field"
              placeholder="Email"
              autocomplete="email"
            />
            <p class="field-message" id="emailMsg"></p>
          </div>

          <div class="form-group">
            <input
              type="password"
              id="password"
              class="input-field"
              placeholder="Password"
              autocomplete="current-password"
            />
            <p class="field-message" id="passwordMsg"></p>
          </div>

          <!-- small registration link, above the button (matches Figma) -->
          <p class="auth-switch">
            <a href="register.html" class="auth-switch-link">New Member? sign up here</a>
          </p>

          <button type="submit" class="btn btn-submit">Login</button>

          <!-- general success/error message -->
          <p class="field-message form-status text-center" id="formMsg"></p>
        </form>
      </div>
    </main>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
