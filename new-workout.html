<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - New Workout</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/app.css" />
  <link rel="stylesheet" href="style/ui.css" />
  <link rel="stylesheet" href="style/new-workout.css" />
</head>
<body>

  <div class="app-shell">

    <header class="topbar">
      <div class="logo">
        <img src="images/logo.png" alt="ActiveCheck" class="logo-img" />
      </div>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <div class="user-greeting">
        <span class="avatar" id="userInitial">?</span>
        <span id="userGreeting">Hello</span>
      </div>
    </header>

    <div class="app-body">

      <nav class="sidebar" id="sidebar">
        <a href="dashboard.html">Dashboard</a>
        <a href="workouts.html" class="active">Workouts</a>
        <a href="program.html">Program</a>
        <a href="metrics.html">Metrics</a>
        <a href="coaches.html">Coaches</a>
      </nav>

      <main class="content">
        <div class="panel">
          <h1 class="panel-title light" id="pageTitle">New Workout</h1>

          <div class="workout-form-box">
            <div class="form-top">
              <h2 class="section-title">Workout Details</h2>
              <button type="button" class="btn btn-primary add-exercise-btn" id="addExerciseBtn">
                Add Exercise +
              </button>
            </div>

            <div class="meta-row">
              <label class="meta-field">
                <span>Date</span>
                <input type="date" id="workoutDate" class="date-input" />
              </label>
              <label class="checkbox-field">
                <input type="checkbox" id="includeAnalytics" checked />
                <span>include in Body Analytics</span>
              </label>
            </div>

            <div class="exercises-head">
              <span>Exercises</span>
              <span>Sets</span>
              <span>Reps</span>
              <span>Weight</span>
              <span class="head-action"></span>
            </div>

            <div id="exerciseRows"></div>

            <p class="field-message form-status text-center" id="formStatus"></p>

            <div class="form-actions">
              <a href="workouts.html" class="btn cancel-btn">Cancel</a>
              <button type="button" class="btn btn-black save-btn" id="saveBtn">Save Workout</button>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script src="js/new-workout.js"></script>
</body>
</html>
