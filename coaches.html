<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - Find A Coach</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/app.css" />
  <link rel="stylesheet" href="style/ui.css" />
  <link rel="stylesheet" href="style/coaches.css" />
</head>
<body>

  <div class="app-shell">

    <header class="topbar">
      <div class="logo">
        <img src="images/logo.png" alt="ActiveCheck" class="logo-img" />
      </div>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <div class="user-greeting">
        <span class="avatar" id="userInitial">?</span>
        <span id="userGreeting">Hello</span>
      </div>
    </header>

    <div class="app-body">

      <nav class="sidebar" id="sidebar">
        <a href="dashboard.html">Dashboard</a>
        <a href="workouts.html">Workouts</a>
        <a href="program.html">Program</a>
        <a href="metrics.html">Metrics</a>
        <a href="coaches.html" class="active">Coaches</a>
      </nav>

      <main class="content">
        <div class="panel">
          <h1 class="panel-title light">Find A Coach</h1>

          <div class="coach-search">
            <input type="text" id="coachSearch" class="input-field"
                   placeholder="Search by name..." />
          </div>

          <div class="coach-list" id="coachList">
            <p class="loading-msg">Loading coaches...</p>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script src="js/coaches.js?v=2"></script>
</body>
</html>
