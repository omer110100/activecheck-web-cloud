<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActiveCheck - Find A Coach</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/coaches.css" />
</head>
<body>

  <div class="app-shell">

    <header class="topbar">
      <div class="logo">
        <img src="images/logo.png" alt="ActiveCheck" class="logo-img" />
      </div>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <div class="user-greeting">
        <span class="avatar">O</span>
        Hello Omer !
      </div>
    </header>

    <div class="app-body">

      <nav class="sidebar" id="sidebar">
        <a href="dashboard.html">Dashboard</a>
        <a href="#">Workouts</a>
        <a href="#">Program</a>
        <a href="#">Metrics</a>
        <a href="#">Messages</a>
        <a href="coaches.html" class="active">Coaches</a>
      </nav>

      <main class="content">
        <div class="panel">
          <h1 class="panel-title light">Find A Coach</h1>

          <!-- search box (interaction: live filter) -->
          <div class="coach-search">
            <input type="text" id="coachSearch" class="input-field"
                   placeholder="Search by name or city..." />
          </div>

          <!-- coaches injected here from JSON via JS -->
          <div class="coach-list" id="coachList">
            <p class="loading-msg">Loading coaches...</p>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/coaches.js?v=20260530"></script>
</body>
</html>
